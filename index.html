<style>
:root{
  /* black base. white = selected / done, red = act now, grey = inactive. one phone-width column. */
  --bg:#0A0A0A; --surface:#161616; --line:#2B2B2B; --text:#F5F5F5; --muted:#A6A6A6;
  --red:#E60023; --red-text:#FF4D5E;
  --latin:'Barlow','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
html:has(body.desk),body.desk{background:#050505}
*{-webkit-tap-highlight-color:transparent}
#stage{position:fixed;left:50%;top:50%;width:390px;height:var(--h);transform-origin:center center}
body.desk #stage{border-radius:44px;overflow:hidden;box-shadow:0 0 0 8px #0A0A0A,0 0 0 9px #3A3A3A,0 30px 80px rgba(0,0,0,.6)}
#stage .app{height:var(--h) !important}
.scroll{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.app *{box-sizing:border-box}
.app button{font:inherit;cursor:pointer;transition:opacity .12s}
.app button:not(:disabled):active{opacity:.7}
.app button:disabled{cursor:default}
.app button:focus-visible,.app input:focus-visible,.app textarea:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.app input,.app textarea{font:inherit}
.app input::placeholder,.app textarea::placeholder{color:#7A7A7A}
.app h1,.app h2{word-break:auto-phrase}
.app button.chip{font-size:13px;font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.lbl{font-size:12px;letter-spacing:0.06em;color:#BDBDBD;font-family:var(--latin);text-transform:uppercase;font-weight:600}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid #3A3A3A;color:#D0D0D0;white-space:nowrap}
.h2{font-size:18px;font-weight:700;margin:0;color:var(--text)}
.ibtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center}
.en{font-family:var(--latin);font-variant-numeric:tabular-nums}
.grid{background-color:#101010;background-size:18px 18px}

/* trial theme: warm black, off-white, amber as the only accent */
:root{--bg:#070707;--surface:#131313;--line:#222221;--text:#F3F1EC;--muted:#A3A19B;--red-text:#F2A93B;--accent:#F2A93B}
html:has(body.desk),body.desk{background:#020202}
body.desk #stage{box-shadow:0 0 0 8px #070707,0 0 0 9px #33322F,0 30px 80px rgba(0,0,0,.7)}
.app{background:#070707 !important}
.card{border-radius:10px}
.h2{display:flex;align-items:center;gap:9px}
.h2::before{content:"";flex:none;width:3px;height:15px;border-radius:2px;background:var(--accent)}
.lbl{letter-spacing:.1em;color:#A3A19B}
.chip{border-color:#383836;color:#D2CFC8}
.big{font-family:'Barlow Condensed','Barlow','Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums}
.app h1{letter-spacing:-0.01em}
.app input::placeholder,.app textarea::placeholder{color:#7D7B76}
.grid{background-color:#0C0C0C}
.app button:disabled{opacity:.35}
.tv,.tv *{color-scheme:normal}
.tv iframe{background:transparent}

/* mode switch (member <-> admin), same control in both pages */
html,body{overscroll-behavior:none}
.msw{position:relative;width:44px;height:26px;border-radius:13px;border:0;padding:0;background:#3A3A38;cursor:pointer;flex:none;transition:background .16s}
.msw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#F3F1EC;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .16s}
.msw.on{background:#2563EB}
.msw.on i{transform:translateX(18px)}
.mode{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#A3A19B;margin-right:6px}
/* PC layout */
#wchrome{display:none}
#wchrome,#wchrome *{box-sizing:border-box}
body.wide{background:#070707}
body.wide #stage{left:0;top:0;width:auto;right:0;bottom:0;height:auto;transform:none !important;border-radius:0;box-shadow:none}
body.wide #stage .app{width:100% !important;height:100vh !important;display:grid !important;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
body.wide .app > header{grid-column:2;grid-row:1}
body.wide .app > main{grid-column:2;grid-row:2}
body.wide .app > main > *{max-width:760px;margin-left:auto !important;margin-right:auto !important}
body.wide .app > header .mark,body.wide .app > header .mark + .en,body.wide .app > header button[aria-label="マイページ"],body.wide .app > header .mode{display:none !important}
body.wide .app > nav{grid-column:1;grid-row:1 / span 2;height:auto !important;display:flex !important;flex-direction:column;gap:2px;border-top:0 !important;border-right:1px solid #1C1C1B;padding:76px 12px 140px !important}
body.wide .app > nav button{flex-direction:row !important;justify-content:flex-start !important;gap:12px !important;height:42px;padding:0 12px;border-top:0 !important;border-radius:6px;font-size:14px !important}
body.wide .app > nav button:not([style*="solid transparent"]){background:#191918}
body.wide #wchrome{display:block}
#wchrome .wlogo{position:fixed;left:0;top:0;width:232px;height:64px;display:flex;align-items:center;gap:10px;padding:0 20px;z-index:5}
#wchrome .wlogo b{font-family:var(--latin);letter-spacing:.16em;font-size:17px;color:#F3F1EC}
#wchrome .wacct{position:fixed;left:0;bottom:0;width:232px;padding:10px 12px 14px;border-top:1px solid #1C1C1B;display:flex;flex-direction:column;gap:6px;z-index:5;background:#070707}
#wchrome .mode{justify-content:space-between;padding:4px 8px;margin:0}
#wchrome .wme{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;border-radius:6px;background:transparent;color:#F3F1EC;text-align:left;font:inherit;cursor:pointer}
#wchrome .wme:hover{background:#191918}
#wchrome .wme .av{width:30px;height:30px;border-radius:50%;background:#2C2C2A;border:1.5px solid #474744;display:flex;align-items:center;justify-content:center;font-family:var(--latin);font-size:12px;font-weight:700}
#wchrome .wme small{display:block;font-size:12px;color:#A3A19B}
</style>
</head>

<div style="position: sticky; top: 0; z-index: 10; background: #070707; margin: -6px -20px 0; padding: 6px 20px 8px; border-bottom: 1px solid #171716">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #131313; border: 1px solid #252524; border-radius: 8px">
<button onClick="{{ segRecruit }}" style="height: 40px; border: 0; border-radius: 6px; font-weight: 700; font-size: 15px; background: {{ seg.rBg }}; color: {{ seg.rFg }}">アイデア</button>
<button onClick="{{ segPain }}" style="height: 40px; border: 0; border-radius: 6px; font-weight: 700; font-size: 15px; background: {{ seg.pBg }}; color: {{ seg.pFg }}">ペイン</button>
<button onClick="{{ segEvent }}" style="height: 40px; border: 0; border-radius: 6px; font-weight: 700; font-size: 15px; background: {{ seg.eBg }}; color: {{ seg.eFg }}">イベント</button>
<button onClick="{{ segOther }}" style="height: 40px; border: 0; border-radius: 6px; font-weight: 700; font-size: 15px; background: {{ seg.oBg }}; color: {{ seg.oFg }}">その他</button>
</div>
</div>

<sc-if value="{{ show.recruit }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 0">
<div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px">
<button onClick="{{ dd.b.tg }}" aria-expanded="{{ dd.b.open }}" style="align-self: flex-start; height: 38px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border: 1px solid #383836; border-radius: 8px; background: transparent; color: #D2CFC8; font-size: 13px; font-weight: 500"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"></path></svg><span>種類：<b style="color: #F3F1EC; font-weight: 700">{{ dd.b.cur }}</b></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{ dd.b.rot }}); transition: transform 0.15s"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-if value="{{ dd.b.open }}" hint-placeholder-val="{{ false }}">
<div style="align-self: flex-start; min-width: 200px; padding: 4px 0; background: #191918; border: 1px solid #383836; border-radius: 8px">
<sc-for list="{{ dd.b.items }}" as="o" hint-placeholder-count="3">
<button onClick="{{ o.pick }}" style="width: 100%; height: 42px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: transparent; border: 0; color: #F3F1EC; font-size: 14px; text-align: left">{{ o.name }}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2A93B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: {{ o.chk }}"><path d="M5 12l5 5 9-10"></path></svg></button>
</sc-for>
</div>
</sc-if>
</div>
<sc-for list="{{ feed }}" as="r" hint-placeholder-count="4">
<sc-if value="{{ r.isRecruit }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ r.open }}" style="display: flex; flex-direction: column; gap: 10px; width: 100%; text-align: left; padding: 16px; color: #F3F1EC; background: transparent; border: 0; border-bottom: 1px solid #252524; border-radius: 0; margin-left: -20px; margin-right: -20px; width: calc(100% + 40px); padding: 26px 20px">
<div style="display: flex; justify-content: space-between; align-items: center; width: 100%">
<span class="chip" style="gap: 5px; background: transparent; border-color: rgba(242,169,59,0.6); color: #F2A93B"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c.8-3.2 3.2-5 6-5s5.2 1.8 6 5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 15c1.6.6 2.6 2.2 3 5"></path></svg>メンバー募集</span>
<span style="font-size: 13px; color: #A3A19B">{{ r.frame }} · {{ r.time }}</span>
</div>
<div style="font-weight: 700; font-size: 17px; line-height: 1.4; word-break: auto-phrase">{{ r.title }}</div>
<div style="font-size: 13px; color: #BDBAB3">{{ r.owner }}</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{ r.slots }}" as="s" hint-placeholder-count="3">
<span class="chip en" style="border-color: {{ s.bd }}; color: {{ s.fg }}; background: {{ s.bg }}">{{ s.role }} · {{ s.label }}</span>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding-top: 10px; border-top: 0; font-size: 13px; color: #A3A19B">
<span>解散条件：{{ r.endShort }}</span>
<span>FB {{ r.fb }}</span>
</div>
</button>
</sc-if>
<sc-if value="{{ r.isIdea }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ r.open }}" style="display: flex; flex-direction: column; gap: 10px; width: 100%; text-align: left; padding: 16px; color: #F3F1EC; background: transparent; border: 0; border-bottom: 1px solid #252524; border-radius: 0; margin-left: -20px; margin-right: -20px; width: calc(100% + 40px); padding: 26px 20px">
<div style="display: flex; justify-content: space-between; align-items: center; width: 100%">
<span class="chip" style="gap: 5px; border-color: #F3F1EC; color: #F3F1EC"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>意見募集</span>
<span style="font-size: 13px; color: #A3A19B">{{ r.time }}</span>
</div>
<div style="font-weight: 700; font-size: 17px; line-height: 1.4; word-break: auto-phrase">{{ r.title }}</div>
<div style="font-size: 14px; color: #D2CFC8; line-height: 1.6">{{ r.summary }}</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{ r.asks }}" as="q" hint-placeholder-count="2">
<span style="display: flex; gap: 8px; font-size: 13px; color: #E9E6DF"><span class="en" style="color: #7D7B76; font-weight: 700">Q</span>{{ q.text }}</span>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding-top: 10px; border-top: 0; font-size: 13px; color: #A3A19B">
<span>{{ r.owner }}</span>
<span>意見 {{ r.fb }} · 回答 {{ r.votes }}</span>
</div>
</button>
</sc-if>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ show.pain }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 0">
<div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px">
<button onClick="{{ dd.ps.tg }}" aria-expanded="{{ dd.ps.open }}" style="align-self: flex-start; height: 38px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border: 1px solid #383836; border-radius: 8px; background: transparent; color: #D2CFC8; font-size: 13px; font-weight: 500"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"></path></svg><span>並び順：<b style="color: #F3F1EC; font-weight: 700">{{ dd.ps.cur }}</b></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{ dd.ps.rot }}); transition: transform 0.15s"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-if value="{{ dd.ps.open }}" hint-placeholder-val="{{ false }}">
<div style="align-self: flex-start; min-width: 200px; padding: 4px 0; background: #191918; border: 1px solid #383836; border-radius: 8px">
<sc-for list="{{ dd.ps.items }}" as="o" hint-placeholder-count="3">
<button onClick="{{ o.pick }}" style="width: 100%; height: 42px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: transparent; border: 0; color: #F3F1EC; font-size: 14px; text-align: left">{{ o.name }}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2A93B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: {{ o.chk }}"><path d="M5 12l5 5 9-10"></path></svg></button>
</sc-for>
</div>
</sc-if>
</div>
<sc-for list="{{ pains }}" as="p" hint-placeholder-count="4">
<div style="padding: 16px; display: flex; flex-direction: column; gap: 10px; background: transparent; border: 0; border-bottom: 1px solid #252524; border-radius: 0; margin-left: -20px; margin-right: -20px; width: calc(100% + 40px); padding: 26px 20px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span class="chip">{{ p.src }}</span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 13px; color: #A3A19B">深刻度
<span style="width: 6px; height: 6px; border-radius: 50%; background: {{ p.d1 }}"></span>
<span style="width: 6px; height: 6px; border-radius: 50%; background: {{ p.d2 }}"></span>
<span style="width: 6px; height: 6px; border-radius: 50%; background: {{ p.d3 }}"></span>
</span>
</div>
<div style="font-weight: 700; font-size: 16px; line-height: 1.45; word-break: auto-phrase">{{ p.text }}</div>
<div style="font-size: 13px; color: #BDBAB3">困っている人：{{ p.who }}</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{ p.tags }}" as="t" hint-placeholder-count="2"><span style="font-size: 13px; color: #BDBAB3">#{{ t.name }}</span></sc-for>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 0">
<button onClick="{{ p.toggle }}" aria-label="共感する" style="height: 40px; padding: 0 14px; border-radius: 6px; border: 1px solid {{ p.empBd }}; background: {{ p.empBg }}; color: {{ p.empFg }}; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg>
<span>自分も {{ p.count }}</span>
</button>
<span style="font-size: 13px; color: {{ p.ideaColor }}">派生アイデア {{ p.ideas }}</span>
</div>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ show.event }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 0">
<div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px">
<button onClick="{{ dd.ex.tg }}" aria-expanded="{{ dd.ex.open }}" style="align-self: flex-start; height: 38px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border: 1px solid #383836; border-radius: 8px; background: transparent; color: #D2CFC8; font-size: 13px; font-weight: 500"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"></path></svg><span>種類：<b style="color: #F3F1EC; font-weight: 700">{{ dd.ex.cur }}</b></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{ dd.ex.rot }}); transition: transform 0.15s"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-if value="{{ dd.ex.open }}" hint-placeholder-val="{{ false }}">
<div style="align-self: flex-start; min-width: 200px; padding: 4px 0; background: #191918; border: 1px solid #383836; border-radius: 8px">
<sc-for list="{{ dd.ex.items }}" as="o" hint-placeholder-count="3">
<button onClick="{{ o.pick }}" style="width: 100%; height: 42px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: transparent; border: 0; color: #F3F1EC; font-size: 14px; text-align: left">{{ o.name }}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2A93B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: {{ o.chk }}"><path d="M5 12l5 5 9-10"></path></svg></button>
</sc-for>
</div>
</sc-if>
</div>
<sc-for list="{{ exItems }}" as="x" hint-placeholder-count="4">
<div style="padding: 16px; display: flex; flex-direction: column; gap: 10px; background: transparent; border: 0; border-bottom: 1px solid #252524; border-radius: 0; margin-left: -20px; margin-right: -20px; width: calc(100% + 40px); padding: 26px 20px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="display: flex; align-items: center; gap: 8px">
<span class="chip" style="border-color: {{ x.typeColor }}; color: {{ x.typeColor }}">{{ x.type }}</span>
<sc-if value="{{ x.fit }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; font-weight: 700; color: #F2A93B">あなた向け</span></sc-if>
</span>
<span class="en" style="font-size: 13px; font-weight: 700; color: #F3F1EC">{{ x.when }}</span>
</div>
<div style="font-weight: 700; font-size: 17px; line-height: 1.4; word-break: auto-phrase">{{ x.title }}</div>
<div style="font-size: 13px; color: #BDBAB3">{{ x.host }} · {{ x.detail }}</div>
<sc-if value="{{ x.official }}" hint-placeholder-val="{{ true }}">
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #F3F1EC"><span style="width: 16px; height: 16px; border-radius: 50%; background: #F3F1EC; color: #070707; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>公式 · 渉外局</span>
</sc-if>
<sc-if value="{{ x.member }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 8px; background: #0C0C0C; border: 1px solid #222221">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #BDBAB3"><span class="en" style="width: 18px; height: 18px; border-radius: 50%; background: #2C2C2A; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 700; color: #F3F1EC">{{ x.initial }}</span>部員投稿 · {{ x.by }}</span>
<span style="font-size: 13px; color: #E9E6DF; line-height: 1.6">{{ x.note }}</span>
</div>
</sc-if>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{ x.tags }}" as="t" hint-placeholder-count="2"><span class="en" style="font-size: 13px; color: #BDBAB3">#{{ t.name }}</span></sc-for>
</div>
<div style="display: flex; gap: 8px; padding-top: 10px; border-top: 0">
<button onClick="{{ x.toggle }}" style="flex: 1; height: 44px; border-radius: 6px; border: 1px solid {{ x.addBd }}; background: {{ x.addBg }}; color: {{ x.addFg }}; font-weight: 700; font-size: 14px">{{ x.addLabel }}</button>
<sc-if value="{{ x.team }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ findTeam }}" style="flex: 1; height: 44px; border-radius: 6px; border: 1px solid #383836; background: #1C1C1B; color: #F3F1EC; font-weight: 700; font-size: 14px">チームを探す</button>
</sc-if>
<sc-if value="{{ x.noTeam }}" hint-placeholder-val="{{ true }}">
<button style="flex: 1; height: 44px; border-radius: 6px; border: 1px solid #383836; background: #1C1C1B; color: #F3F1EC; font-weight: 700; font-size: 14px">詳細を見る</button>
</sc-if>
</div>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ show.other }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 0">
<div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px">
<button onClick="{{ dd.ot.tg }}" aria-expanded="{{ dd.ot.open }}" style="align-self: flex-start; height: 38px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border: 1px solid #383836; border-radius: 8px; background: transparent; color: #D2CFC8; font-size: 13px; font-weight: 500"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"></path></svg><span>種類：<b style="color: #F3F1EC; font-weight: 700">{{ dd.ot.cur }}</b></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{ dd.ot.rot }}); transition: transform 0.15s"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-if value="{{ dd.ot.open }}" hint-placeholder-val="{{ false }}">
<div style="align-self: flex-start; min-width: 200px; padding: 4px 0; background: #191918; border: 1px solid #383836; border-radius: 8px">
<sc-for list="{{ dd.ot.items }}" as="o" hint-placeholder-count="3">
<button onClick="{{ o.pick }}" style="width: 100%; height: 42px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: transparent; border: 0; color: #F3F1EC; font-size: 14px; text-align: left">{{ o.name }}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2A93B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: {{ o.chk }}"><path d="M5 12l5 5 9-10"></path></svg></button>
</sc-for>
</div>
</sc-if>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<input type="text" aria-label="投稿を書く" placeholder="読んだ本でも、雑談でも" style="flex: 1; min-width: 0; height: 46px; padding: 0 16px; background: #131313; border: 1px solid #383836; border-radius: 6px; color: #F3F1EC; font-size: 15px">
<button aria-label="投稿" style="flex: none; width: 46px; height: 46px; padding: 0; border: 0; border-radius: 50%; background: #F3F1EC; color: #070707; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg></button>
</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{ otPosts }}" as="p" hint-placeholder-count="4">
<div style="display: flex; gap: 12px; padding: 14px 0; border-bottom: {{ p.sep }}">
<span class="en" style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #2C2C2A; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{ p.ini }}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: #A3A19B">{{ p.who }} · {{ p.time }} · {{ p.tag }}</span>
<sc-if value="{{ p.hasBook }}" hint-placeholder-val="{{ false }}">
<span style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: #131313; border: 1px solid #252524">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#BDBAB3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 19V5a2 2 0 0 1 2-2h14v14H6a2 2 0 0 0-2 2 2 2 0 0 0 2 2h14"></path></svg>
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 700; font-size: 15px">{{ p.book }}</span><span style="font-size: 13px; color: #A3A19B">{{ p.author }}</span></span>
</span>
</sc-if>
<span style="font-size: 15px; line-height: 1.65; color: #E9E6DF">{{ p.text }}</span>
<div style="display: flex; align-items: center; gap: 14px">
<button onClick="{{ p.toggle }}" aria-label="いいね" style="height: 40px; padding: 0 4px 0 0; border: 0; background: transparent; color: {{ p.likeFg }}; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="{{ p.likeFill }}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg><span class="en">{{ p.likeN }}</span></button>
<button style="height: 40px; padding: 0 4px; border: 0; background: transparent; color: #A3A19B; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg><span class="en">{{ p.rep }}</span></button>
</div>
</div>
</div>
</sc-for>
</div>
</div>
</sc-if>
</div>
</sc-if>


<sc-if value="{{ show.post }}" hint-placeholder-val="{{ false }}">
<div style="padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 6px"><span class="chip" style="gap: 5px; background: {{ cur.typeBg }}; border-color: {{ cur.typeBd }}; color: {{ cur.typeFg }}">{{ cur.typeLabel }}</span><span class="chip">{{ cur.time }}</span></div>
<h1 style="margin: 0; font-size: 21px; font-weight: 700; line-height: 1.4; word-break: auto-phrase">{{ cur.title }}</h1>
<div style="display: flex; align-items: center; gap: 10px">
<span class="en" style="width: 32px; height: 32px; border-radius: 50%; background: #2C2C2A; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{ cur.initial }}</span>

<script>
// mode switch: replace() so no history entry is left (iOS edge-swipe can't "go back" into the other mode)
document.addEventListener('click',function(e){
  var sw=e.target.closest&&e.target.closest('.msw'), ln=e.target.closest&&e.target.closest('a[data-replace]');
  if(!sw&&!ln)return; e.preventDefault(); e.stopPropagation();
  if(sw){ sw.classList.toggle('on'); setTimeout(function(){ location.replace(sw.dataset.to); },170); }
  else location.replace(ln.getAttribute('href'));
},true);
</script>
