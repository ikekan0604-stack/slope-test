<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>SLOPE 運営画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  /* neutral UI, one accent (blue) for timeline bars, focus and selection; red only for overdue / destructive */
  --bg:#FFFFFF; --side:#F9FAFB; --hover:#F3F4F6; --line:#E5E7EB; --line2:#D1D5DB;
  --text:#111827; --sub:#374151; --muted:#6B7280; --dim:#9CA3AF;
  --accent:#2563EB; --accent-soft:#EFF4FF; --bad:#DC2626;
  --font:'Inter','Noto Sans JP','Hiragino Sans','Yu Gothic UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{height:52px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);font-weight:700;letter-spacing:.06em}
.brand small{font-weight:500;letter-spacing:0;color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:1px;padding:10px 8px}
.nav button{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border:0;border-radius:4px;background:transparent;color:var(--sub);text-align:left;font-weight:500}
.nav button:hover{background:var(--hover)}
.nav button[aria-current="page"]{background:#E5E7EB;color:var(--text);font-weight:600}
.nav .n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.acct{margin-top:auto;border-top:1px solid var(--line);padding:8px;position:relative}
.acct > button{width:100%;display:flex;align-items:center;gap:10px;padding:6px 8px;border:0;border-radius:4px;background:transparent;text-align:left}
.acct > button:hover{background:var(--hover)}
.acct .who{display:flex;flex-direction:column;line-height:1.3;min-width:0;flex:1}
.acct .who span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{position:absolute;z-index:40;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(17,24,39,.12);padding:4px;min-width:240px}
.menu .mh{padding:6px 10px;font-size:11px;color:var(--muted);font-weight:600}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;border-radius:4px;background:transparent;text-align:left}
.menu button:hover{background:var(--hover)}
.menu button .r{margin-left:auto;font-size:12px;color:var(--muted)}
.acct .menu{bottom:56px;left:8px;right:8px}
.av{width:24px;height:24px;border-radius:50%;background:#E5E7EB;color:var(--sub);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none}
.av.lg{width:28px;height:28px;font-size:12px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.top{height:52px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.body{flex:1;min-height:0;overflow:auto;padding:20px}
.body.flush{padding:0;overflow:hidden;display:flex;flex-direction:column;position:relative}

/* controls */
.btn{height:32px;padding:0 12px;border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--sub);font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--text);border-color:var(--text);color:#fff}
.btn.primary:hover{background:#000}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.danger{color:var(--bad)}
.ib{width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;padding:0}
.ib:hover{background:var(--hover);color:var(--text)}
.input{height:32px;padding:0 10px;border:1px solid var(--line2);border-radius:6px;background:#fff;min-width:0;width:100%}
textarea.input{height:auto;min-height:76px;padding:8px 10px;resize:vertical}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.input::placeholder,textarea::placeholder{color:var(--dim)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;background:var(--hover);color:var(--sub);font-size:11px;font-weight:500;white-space:nowrap}
.utabs{display:flex;gap:20px;border-bottom:1px solid var(--line);padding:0 20px;flex:none;overflow-x:auto}
.utabs button{height:40px;border:0;background:transparent;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;padding:0 2px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.utabs button[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--text);font-weight:600}
.utabs .n{font-size:12px;color:var(--muted)}
.stat{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.stat i{width:6px;height:6px;border-radius:50%;background:var(--text);display:inline-block}
.stat.off i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--dim)}
.stat.off{color:var(--muted)}
.bad{color:var(--bad)}
.check{width:16px;height:16px;accent-color:var(--text)}

/* tables */
table{width:100%;border-collapse:collapse}
th{height:36px;padding:0 12px;text-align:left;font-size:12px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;background:#fff;position:sticky;top:0;z-index:1}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--side)}
.tw{border:1px solid var(--line);border-radius:6px;overflow:auto}
.tw tr:last-child td{border-bottom:0}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.cell2{display:flex;flex-direction:column;gap:2px;min-width:0}
.cell2 .s{font-size:12px;color:var(--muted)}
.acts{display:flex;gap:4px;justify-content:flex-end}
.prog{display:flex;align-items:center;gap:8px}
.prog .b{width:80px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog .b i{display:block;height:100%;background:var(--text)}
.stack{display:flex}
.stack .av{border:2px solid #fff;margin-left:-6px}
.stack .av:first-child{margin-left:0}

/* modal */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
.dlg{width:100%;max-width:440px;background:#fff;border-radius:8px;box-shadow:0 20px 48px rgba(17,24,39,.2);display:flex;flex-direction:column;max-height:76vh}
.dlg .h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
.dlg .h .sp{flex:1}
.dlg .c{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.dlg .f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.dlg .f .sp{flex:1}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;color:var(--muted);font-weight:500}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
input[type=date].input{min-width:0;-webkit-appearance:none;appearance:none}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .nm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.mrow .nm span{font-size:12px;color:var(--muted)}
.mrow button.link{border:0;background:transparent;padding:0;text-align:left;font-weight:500}
.mrow button.link:hover{text-decoration:underline}
.ncard{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:6px}
.ncard .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ncard .t span{font-size:12px;color:var(--muted)}

/* gantt */
.gs{flex:1;min-height:0;overflow:auto;position:relative}
.gg{position:relative}
.gr{display:grid;align-items:center;height:40px;border-bottom:1px solid var(--line)}
.gl{position:sticky;left:0;z-index:2;background:#fff;height:100%;display:flex;align-items:center;gap:8px;padding:0 12px 0 20px;border-right:1px solid var(--line);cursor:pointer;min-width:0}
.gr:hover .gl{background:var(--side)}
.gl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl .nm.done{color:var(--dim);text-decoration:line-through}
.gl .lt{width:6px;height:6px;border-radius:50%;background:var(--bad);flex:none}
.gt{position:relative;height:100%}
.ghead{position:sticky;top:0;z-index:4;background:#fff;height:56px}
.ghead .gl{cursor:default;align-items:flex-end;padding-bottom:8px;font-size:12px;color:var(--muted);font-weight:500;z-index:5}
.ghead:hover .gl{background:#fff}
.gm{position:absolute;top:8px;font-size:12px;font-weight:600;color:var(--sub);padding-left:6px;white-space:nowrap}
.gd{position:absolute;top:32px;font-size:11px;color:var(--muted);padding-left:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.glines{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0}
.gw{position:absolute;top:0;bottom:0;border-left:1px solid #F3F4F6}
.gmo{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.gnow{position:absolute;top:0;bottom:0;border-left:1.5px solid var(--accent);z-index:3}
.bar{position:absolute;top:10px;height:20px;border-radius:4px;background:var(--accent);display:flex;align-items:center;overflow:hidden;cursor:grab;touch-action:none;user-select:none;z-index:1}
.bar .lb{font-size:11px;font-weight:600;color:#fff;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.bar.done{background:#E5E7EB}
.bar.done .lb{color:var(--muted)}
.bar.none{background:#fff;box-shadow:inset 0 0 0 1px var(--line2)}
.bar.none .lb{color:var(--muted)}
.bar.late{box-shadow:0 0 0 2px var(--bad)}
.bar.drag{cursor:grabbing;opacity:.85}
.bar .hd{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize}
.fab{position:absolute;left:20px;bottom:20px;z-index:10;width:40px;height:40px;border:0;border-radius:8px;background:var(--text);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(17,24,39,.25)}
.fab:hover{background:#000}
.fab svg.i{width:20px;height:20px;stroke-width:2}

/* track editor */
.trk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:start}
.pane{border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.pane .ph{height:40px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);font-weight:600}
.code{display:grid;grid-template-columns:36px minmax(0,1fr);height:420px}
.gutter{margin:0;padding:10px 8px 10px 0;text-align:right;color:var(--dim);font-size:12px;line-height:24px;overflow:hidden;user-select:none;border-right:1px solid var(--line);background:var(--side);font-family:var(--font)}
.gutter .err{color:var(--bad);font-weight:700}
textarea.src{display:block;width:100%;height:100%;resize:none;border:0;outline:none;background:transparent;padding:10px 12px;font-size:13px;line-height:24px;white-space:pre;overflow:auto;tab-size:2}
.map-wrap{overflow:auto;height:420px;padding:8px 4px}
.map-wrap svg{display:block}
.node{cursor:pointer}
.node:focus{outline:none}
.node:focus-visible .ring{stroke:var(--text);stroke-width:2}
.warn{display:flex;flex-direction:column;gap:4px;padding:8px 12px;border-top:1px solid var(--line);font-size:12px}
.warn .w{display:flex;gap:8px}
.warn .w b{color:var(--bad);flex:none}
.ok{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:16px}
.meta .fld{min-width:140px}
.detail{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.detail > div{padding:14px;display:flex;flex-direction:column;gap:10px}
.detail > div + div{border-left:1px solid var(--line)}
.mat{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.mat:last-child{border-bottom:0}
.mat .t{flex:1;min-width:0;display:flex;flex-direction:column}
.mat .t a{color:var(--text);text-decoration:none;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat .t a:hover{text-decoration:underline}
.mat .t span{font-size:12px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#fff;padding:8px 14px;border-radius:6px;font-weight:500;z-index:60;box-shadow:0 8px 24px rgba(17,24,39,.2)}
.locked{padding:80px 16px;text-align:center;color:var(--muted)}

@media (max-width:980px){ .trk,.detail{grid-template-columns:minmax(0,1fr)} .detail > div + div{border-left:0;border-top:1px solid var(--line)} }
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .side{flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand{border-bottom:0;height:48px;white-space:nowrap} .brand small{display:none}
  .nav{flex-direction:row;padding:0 4px}
  .nav button{white-space:nowrap}
  .acct{margin:0 0 0 auto;border-top:0;padding:4px}
  .acct .who{display:none}
  .acct .menu{bottom:auto;top:44px;left:auto;right:4px;position:fixed}
  .body{padding:16px}
  .hide-sm{display:none}
}

@media (max-width:760px){
  .brand{display:none}
  .nav{padding:0 8px}
  .nav button{height:44px;border-radius:0;background:transparent !important;border-bottom:2px solid transparent;padding:0 8px}
  .nav button[aria-current="page"]{border-bottom-color:var(--text)}
  .nav button svg.i{display:none}
  .top{padding:0 12px 0 16px}
  .utabs{padding:0 16px}
  .tw{border:0;border-radius:0;overflow:visible}
  .tw thead{display:none}
  .tw table,.tw tbody{display:block}
  .tw tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
  .tw tr:last-child{border-bottom:0}
  .tw td{display:block;padding:0;border:0 !important;max-width:none !important}
  .tw td:first-child{flex:1 1 100%}
  .tw td.empty{flex:1 1 100%}
  .tw td.a{flex:1 1 100%}
  .tw td.a .acts{justify-content:flex-start;margin-left:-10px}
  .tw td.hide-sm{display:none !important}


  .tw td[data-l]{display:inline-flex;align-items:center;gap:6px;text-align:left !important}
  .tw td[data-l]::before{content:attr(data-l);font-size:12px;color:var(--muted)}
  tr.click:hover td{background:transparent}
  .body{padding:4px 16px 24px}
  .body.flush{padding:0}
  .ov{align-items:flex-end;padding:0}
  .dlg{max-width:none !important;border-radius:12px 12px 0 0;max-height:88vh}
  .dlg .f{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .dlg .f .btn{height:40px;flex:1;justify-content:center}
  .dlg .f .sp{display:none}
  .input{height:40px;font-size:16px}
  textarea.input{font-size:16px}
  .meta .fld{flex:1 1 140px}
  .meta > .dim{display:none}
  .code{height:260px} .map-wrap{height:auto;max-height:520px}
  .detail > div > div[style*="grid-template-columns"]{grid-template-columns:minmax(0,1fr) !important}
  .fab{left:auto;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:12px}
  .gl{padding-left:12px}
  .top .hide-sm{display:none !important}
  .toast{bottom:calc(24px + env(safe-area-inset-bottom))}
}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;font:inherit;color:inherit}
button.kpi:hover{border-color:var(--line2);background:var(--side) !important}
.kpi span{font-size:12px;color:var(--muted)}
.kpi b{font-size:26px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.dcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{border:1px solid var(--line);border-radius:6px;min-width:0}
.card .ch{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);font-weight:600}
.card .ch button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:4px 0}
.card .ch button:hover{color:var(--text)}
.li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
button.li{width:100%;border-left:0;border-right:0;border-top:0;background:#fff;text-align:left}
button.li:hover{background:var(--side)}
.li .t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.4}
.li .t b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .r{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.li .r.bad{color:var(--bad)}
.card{overflow:hidden}
.hb{display:flex;align-items:center;gap:10px;padding:8px 14px}
.hb .l{width:96px;font-size:12px;color:var(--sub);flex:none}
.hb .b{flex:1;height:6px;background:var(--hover);border-radius:3px;overflow:hidden}
.hb .b i{display:block;height:100%;background:var(--text)}
.hb .v{width:24px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:980px){ .dgrid{display:flex;flex-direction:column;align-items:stretch;gap:16px} .dcol{display:contents} .dgrid .card{order:3} .dgrid .card.o1{order:1} .dgrid .card.o2{order:2} }
.kpi .bad{color:var(--bad)}
@media (max-width:760px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px} .kpi{padding:12px} .kpi b{font-size:22px} }

.gadd .gl{color:var(--muted);gap:8px}
.gadd .gl:hover,.gadd:hover .gl{color:var(--text);background:var(--side)}
.gfill .gl{cursor:default}
.gr.gfill:hover .gl{background:#fff}

/* 業務ツリー */
.tbar{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{height:28px;padding:0 12px;border:0;border-left:1px solid var(--line2);background:#fff;color:var(--sub);font-size:12px;font-weight:500}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--text);color:#fff}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.wlist{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.wh,.wr{display:grid;grid-template-columns:minmax(0,1fr) 150px 120px 200px 44px;align-items:center;min-height:40px;border-bottom:1px solid var(--line)}
.wh{min-height:36px;font-size:12px;color:var(--muted);font-weight:500}
.wh > div,.wr > div{padding:0 12px;min-width:0}
.wr:hover{background:var(--side)}
.wr.d0{background:#F9FAFB}
.wr.d0 .wt{font-weight:600}

function mapSVG(g, sel, avail) {

  }

    var hot = sel && (e.from === sel || e.to === sel);
    out += '<path d="' + seg(a, b) + '" fill="none" stroke="' + (hot ? '#2563EB' : (e.ext ? '#98A2B3' : '#98A2B3')) + '" stroke-width="' + (hot ? 2.2 : 1.6) + '"' + (e.ext ? ' stroke-dasharray="3 5"' : '') + ' stroke-linecap="round"/>';
  });
  var maxChars = Math.floor((COL - 34) / 13);
  g.nodes.forEach(function (n) {
    var p = at[n.id], isSel = n.id === sel;

    out += '<circle class="ring" cx="' + p.x + '" cy="' + p.y + '" r="' + (big ? 8 : 6) + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2"' + (n.kind === 'ext' ? ' stroke-dasharray="2 2.5"' : '') + '/>';

  });
  return out + '</svg>';
}

function viewDash() {

  var mine = myTasks(m.id), mineOpen = mine.filter(function (o) { return !isDone(o.k); });
  var mineLate = mineOpen.filter(function (o) { return late(o.k); }).length;
  var rep = S.posts.filter(function (x) { return x.reports > 0 && x.state === 'ok'; }).length;
  var off = S.offers.filter(function (o) { return o.state === 'wait'; }).length;

  var ks = [kpi('自分の作業', mineOpen.length, mineLate ? '<span class="bad">期限切れ ' + mineLate + '</span>' : '期限切れなし')];
  if (isAdmin()) {
    var lateAll = all.filter(function (o) { return late(o.k); }).length;
    ks.push(kpi('進行中のイベント・業務', live.length, '期限切れの作業 ' + lateAll, false, 'projects'));
    ks.push(kpi('未対応', rep + off, '通報 ' + rep + '・情報提供 ' + off, false, rep ? 'board' : 'notices'));

  } else {

  }

// drag bars: body moves the task, right edge changes the deadline

  var bar = e.target.closest('[data-bar]'); if (!bar || e.button !== 0 || bar.classList.contains('lock')) return;

function dateGuides(d) {
  if (!d.gd) { d.gd = ['s', 'e'].map(function (k) { var l = document.createElement('div'); l.className = 'dguide'; l.innerHTML = '<span></span>'; document.body.appendChild(l); return l; }); }
  var s0 = dayOf(d.k.start) + (d.resize ? 0 : d.dd * DAY), e0 = Math.max(s0, dayOf(d.k.end) + d.dd * DAY);

}
document.addEventListener('pointermove', function (e) {

  else nodesOf(d.k).forEach(function (x) { x.start = isoOf(dayOf(x.start) + d.dd * DAY); x.end = isoOf(dayOf(x.end) + d.dd * DAY); });
  save(); render();

// ---------------- 業務リスト: spreadsheet-style editing ----------------
var FOCUS = null; // { id, c, parent, caret }
function toastUndo(msg) {
  var t = document.getElementById('toast');
  t.innerHTML = esc(msg) + ' <button data-act="undoAll" style="margin-left:10px;border:0;background:transparent;color:#93C5FD;font-weight:600;cursor:pointer">元に戻す</button>';

}
function refocus() {
  if (!FOCUS) return;

  var el = document.querySelector(sel); FOCUS = null;

}

function sibs(n) { var p = parentOf(n); return p ? kids(p) : S.projects; }
function setTitle(n, v) { if (n.tasks) n.name = v; else n.title = v; }
function newNode(par, title) {
  var s0 = par ? (dayOf(par.start) > TODAY ? par.start : (dayOf(par.end) < TODAY ? par.start : isoOf(TODAY))) : isoOf(TODAY);
  var e0 = par ? par.end : isoOf(TODAY + 30 * DAY);
  return { id: uid('k'), title: title, who: '', start: s0, end: e0, done: false };
}
function addUnder(par, title, after) {
  if (!par) { var ev = { id: uid('pj'), name: title, kind: 'event', announce: 'before', reg: 0, unit: '教育部', who: '', start: isoOf(TODAY), end: isoOf(TODAY + 30 * DAY), tasks: [] }; S.projects.push(ev); return ev; }
  if (!par.tasks) { if (!par.kids) par.kids = []; delete par.done; }
  var n = newNode(par, title), arr = kids(par), i = after ? arr.indexOf(after) : -1;
  if (i >= 0) arr.splice(i + 1, 0, n); else arr.push(n);
  expandTo(par.id); return n;
}
function removeNode(n) { var p = parentOf(n); if (p) { var a = kids(p), i = a.indexOf(n); if (i >= 0) a.splice(i, 1); } else S.projects = S.projects.filter(function (x) { return x !== n; }); }
function indent(n) {
  var p = parentOf(n); if (!p) return false;
  var a = kids(p), i = a.indexOf(n); if (i <= 0) return false;
  var prev = a[i - 1]; if (!canEdit(prev)) return false;
  a.splice(i, 1);
  if (!prev.tasks) { if (!prev.kids) prev.kids = []; delete prev.done; }
  kids(prev).push(n); expandTo(prev.id); return true;
}
function outdent(n) {
  var p = parentOf(n); if (!p) return false; var gp = parentOf(p); if (!gp) return false;
  if (!isAdmin() && !canEdit(gp)) return false;
  var a = kids(p); a.splice(a.indexOf(n), 1);
  var b = kids(gp); b.splice(b.indexOf(p) + 1, 0, n); return true;
}
function moveFocus(el, dir) {
  var c = el.dataset.c === 'new' ? 't' : el.dataset.c;
  var all = Array.prototype.slice.call(document.querySelectorAll('.cell[data-c="' + c + '"]:not([disabled]), .cell[data-c="new"]'));
  if (c !== 't') all = Array.prototype.slice.call(document.querySelectorAll('.cell[data-c="' + c + '"]:not([disabled])'));
  var i = all.indexOf(el); var t = all[i + dir]; if (t) { t.focus(); if (t.select && (t.type === 'text' || t.type === 'textarea')) t.select(); }
}
document.addEventListener('keydown', function (e) {
  var el = e.target; if (!el.classList || !el.classList.contains('cell') || !el.closest('.wcards, .gg')) return;
  var c = el.dataset.c;
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.altKey && el.dataset.id) {
    e.preventDefault(); var mn = task(el.dataset.id); if (!mn || !canMove(mn)) return;
    if (!parentOf(mn)) manualRoots();
    var ar = sibs(mn), mi = ar.indexOf(mn), mj = mi + (e.key === 'ArrowDown' ? 1 : -1);
    if (mj < 0 || mj >= ar.length) return;
    snap(); ar.splice(mi, 1); ar.splice(mj, 0, mn); rerender({ id: mn.id, c: el.dataset.c }); return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { if (el.tagName === 'SELECT') return; e.preventDefault(); moveFocus(el, e.key === 'ArrowDown' ? 1 : -1); return; }

    var nn = addUnder(par, v);
    rerender(pid ? { c: 'new', parent: pid } : { id: nn.id, c: 't' });

    return;
  }
  if (c !== 't') return;
  var n = task(el.dataset.id); if (!n) return;
  if (e.key === 'Enter') {
    e.preventDefault(); var v2 = el.value.trim(); if (v2) setTitle(n, v2);
    var p = parentOf(n);
    if (!p) { if (!canEdit(n)) return; var k0 = addUnder(n, ''); rerender({ id: k0.id, c: 't' }); return; }
    if (!canEdit(p) && !isAdmin()) { rerender(); return; }

    return;
  }
  if (e.key === 'Backspace' && el.value === '' && parentOf(n) && !kids(n).length) {
    e.preventDefault(); var all = Array.prototype.slice.call(document.querySelectorAll('.cell[data-c="t"]')); var prev = all[all.indexOf(el) - 1];
    snap(); removeNode(n); rerender(prev ? { id: prev.dataset.id, c: 't' } : null); return;
  }

});
document.addEventListener('focusout', function (e) {
  var el = e.target; if (!el.classList || !el.classList.contains('cell') || el.dataset.c !== 't') return;
  var n = task(el.dataset.id); if (!n) return;
  var v = el.value.trim();
  if (!v) { if (n.fresh) { removeNode(n); save(); setTimeout(function () { if (!document.querySelector('.cell:focus')) render(); }, 0); } else el.value = ttl(n); return; }
  if (v !== ttl(n)) { setTitle(n, v); delete n.fresh; save(); } else delete n.fresh;

document.addEventListener('change', function (e) {
  var el = e.target; if (!el.classList || !el.closest || !el.closest('.wcards, .gg')) return;
  var c = el.dataset.c; if (!c || c === 't' || c === 'new') return;

    var p = parentOf(n); if (p && (n.start < p.start || n.end > p.end)) toast('「' + ttl(p) + '」の期間をはみ出しています');

});
document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('[data-act="rowDel"],[data-act="undoAll"]'); if (!b) return;
  e.stopPropagation();

// ---------------- gantt zoom: pinch (touch / trackpad / Safari gesture) and ctrl+wheel ----------------
function zoomTo(px, cx) {
  var gs = document.getElementById('gs'), gg = document.querySelector('.gg'); if (!gs || !gg) return;
  px = Math.max(2, Math.min(48, px)); var old = +gg.dataset.px, LW = +gg.dataset.lw, lo = +gg.dataset.lo;
  if (Math.abs(px - old) < 0.05) return;
  var r = gs.getBoundingClientRect(), xr = cx == null ? (r.width + LW) / 2 : Math.max(LW, cx - r.left);
  var at = lo + ((gs.scrollLeft + xr - LW) / old) * DAY;
  S.zoom = px; save(); render();
  gs = document.getElementById('gs'); gg = document.querySelector('.gg'); if (!gs || !gg) return;
  gs.scrollLeft = LW + ((at - +gg.dataset.lo) / DAY) * px - xr; UI.sl = gs.scrollLeft;
}
var ZQ = null;
function zoomSoon(px, cx) { var first = !ZQ; ZQ = { px: px, cx: cx }; if (first) requestAnimationFrame(function () { var q = ZQ; ZQ = null; zoomTo(q.px, q.cx); }); }
function inGantt(t) { return t && t.closest && t.closest('#gs'); }
document.addEventListener('wheel', function (e) {
  if (!e.ctrlKey || !inGantt(e.target)) return;

  zoomSoon((ZQ ? ZQ.px : +gg.dataset.px) * Math.exp(-e.deltaY * 0.004), e.clientX);

var PINCH = null;
document.addEventListener('touchstart', function (e) {
  if (e.touches.length !== 2 || !inGantt(e.target)) return;
  var a = e.touches[0], b = e.touches[1], gg = document.querySelector('.gg');
  PINCH = { d: Math.abs(a.clientX - b.clientX) || 1, px: +gg.dataset.px, cx: (a.clientX + b.clientX) / 2 };
}, { passive: true });
document.addEventListener('touchmove', function (e) {
  if (!PINCH || e.touches.length !== 2) return;
  e.preventDefault(); var a = e.touches[0], b = e.touches[1];
  var d = Math.abs(a.clientX - b.clientX) || 1; zoomSoon(PINCH.px * d / PINCH.d, PINCH.cx);
}, { passive: false });

document.addEventListener('gesturestart', function (e) { if (!inGantt(e.target)) return; e.preventDefault(); var gg = document.querySelector('.gg'); GST = { px: +gg.dataset.px, cx: e.clientX }; });
document.addEventListener('gesturechange', function (e) { if (!GST) return; e.preventDefault(); if (!PINCH) zoomSoon(GST.px * e.scale, GST.cx); });
document.addEventListener('gestureend', function () { GST = null; });

render();
})();
